<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <script src="{{ url_for('static', filename='js/slider.js') }}"></script>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">   
    </head>
    <body class="body-cadastro">                    
            <div class="box-usuario">
                <form action="/cadastrar" method="POST">
                    <a class="titulo-login">Cadastre-se</a>
                    <div class="box-cadastro">
                        <input class="nome2" type="text" name="usuario" placeholder="Usuário" required>
                        <input class="nome2" type="email" name="email" placeholder="Email" required>
                        <input class="nome2" type="password" name="senha" placeholder="Senha" required>                   
                        <button class="botao-cadastrar" type="submit">Cadastrar</button>
                    </div>
                </form>        
            </div>                             
    </body>
</html>
